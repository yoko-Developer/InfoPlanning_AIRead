# 日付変換アプリケーション メッセージ定義

# アプリケーション開始・終了
app.start=日付変換処理を開始します
app.complete=日付変換処理が正常に完了しました (変換行数: {0}行)
app.error=日付変換処理でエラーが発生しました: {0}

# CSV処理
csv.start=CSVファイルの和暦変換を開始します
csv.complete=CSVファイルの和暦変換が完了しました (総行数: {0}行, 変換行数: {1}行)
csv.progress=処理進捗: {0}行目を処理中...
csv.error=CSVファイル変換処理でエラーが発生しました: {0}

# 設定情報
config.input.file=入力ファイル: {0}
config.output.file=出力ファイル: {0}
config.target.columns=対象列: {0}
config.charset=文字コード: {0}
config.details=変換設定 - 入力: {0}, 出力: {1}, 対象列: {2}, 文字コード: {3}, 出力形式: {4}
config.output.format=出力形式: {0}
config.extra.separators=追加の区切り文字: {0}

# 日付変換
date.convert.success=日付変換実行: [{0}] {1} → {2}
date.convert.unsupported.era=未対応の年号が指定されました: {0} (値: {1})
date.convert.invalid.date=実在しない日付が指定されました: {0} (西暦{1}年{2}月{3}日は存在しません)
date.convert.parse.failed=日付形式として認識できませんでした: {0} (理由: {1})
date.parse.failed=日付文字列の解析に失敗しました: {0} (エラー: {1})

# 使用方法
usage.header=使用方法:
usage.command=java -jar dateconverter.jar --in <input.csv> --out <output.csv> [--cols col1,col2,...] [--charset UTF-8] [--format YYYYMMDD|YYYYMM] [--extra-separators <chars>] [--required-content <str>]
usage.options.header=オプション:
usage.option.in=  --in <file>     入力CSVファイル
usage.option.out=  --out <file>    出力CSVファイル
usage.option.cols=  --cols <list>   変換対象列（カンマ区切り）
usage.option.charset=  --charset <cs>  文字コード（デフォルト: UTF-8）
usage.option.format=  --format <fmt>   出力形式（YYYYMMDD または YYYYMM、デフォルト: YYYYMMDD）
usage.option.extra.separators=  --extra-separators <chars>  追加の区切り文字（例: ／~、デフォルト: なし）
usage.option.required.content=  --required-content <str>  この文字列を含まないファイルは変換せずそのままコピー（デフォルト: チェックなし）
usage.example.header=例:
usage.example.command=java -jar dateconverter.jar --in input.csv --out output.csv --cols 取得,使用,供用 --format YYYYMM
usage.target.columns.example=対象列の例: 取得,使用,供用,契約
usage.conversion.example=変換例: H10.5 → 199805, H21.6 → 200906

# エラーメッセージ
error.invalid.arguments=引数が不正です
error.file.not.found=ファイルが見つかりません: {0}
error.file.read.error=ファイル読み込みエラー: {0}
error.file.write.error=ファイル書き込みエラー: {0}
error.charset.unsupported=サポートされていない文字コードです: {0}